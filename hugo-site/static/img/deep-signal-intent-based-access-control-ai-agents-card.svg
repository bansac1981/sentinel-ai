<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 312">
  <defs>
    <style>
      .flow { stroke-dasharray:10 5; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -45; } }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50%{opacity:0} }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#c7d2fe" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="520" height="312" fill="#f8f9ff"/>
  <rect width="520" height="312" fill="url(#dots)"/>
  <rect x="0" y="0" width="4" height="312" fill="#e11d48"/>

  <!-- Header -->
  <rect x="0" y="0" width="520" height="52" fill="#1e1b4b"/>
  <line x1="0" y1="52" x2="520" y2="52" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="16" y="20" font-family="IBM Plex Mono,Courier New,monospace" font-size="7.5" fill="#a5b4fc" letter-spacing="2.5" font-weight="600">DEEP SIGNAL  ◈  GRID THE GREY</text>
  <text x="16" y="42" font-family="IBM Plex Mono,Courier New,monospace" font-size="12" fill="#ffffff" font-weight="700">Intent-Based Access Control for AI Agent Security</text>

  <!-- Terminal -->
  <rect x="16" y="62" width="220" height="130" rx="5" fill="#1e1b4b"/>
  <rect x="16" y="62" width="220" height="3" fill="#4f46e5"/>
  <rect x="16" y="65" width="220" height="22" fill="#2d2a5e"/>
  <circle cx="30" cy="76" r="4" fill="#ef4444"/>
  <circle cx="42" cy="76" r="4" fill="#f59e0b"/>
  <circle cx="54" cy="76" r="4" fill="#22c55e"/>
  <text x="126" y="80" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#a5b4fc" text-anchor="middle" font-weight="600" letter-spacing="1">ibac-enforce — policy-eval</text>
  <text x="26"  y="105" font-family="IBM Plex Mono,Courier New,monospace" font-size="8.5" fill="#4ade80" font-weight="700">$</text>
  <text x="36"  y="105" font-family="IBM Plex Mono,Courier New,monospace" font-size="8.5" fill="#e2e8f0">ibac evaluate --session-id a8f3c</text>
  <text x="36"  y="119" font-family="IBM Plex Mono,Courier New,monospace" font-size="8.5" fill="#e2e8f0">  --action db.read --intent-anchor</text>
  <rect x="36"  y="124" width="6" height="10" fill="#818cf8" class="blink"/>

  <!-- Capability pills (4) -->
  
  
  
  
  
  <rect x="22" y="141" width="92" height="18" rx="9" fill="#312e81" stroke="#6366f1" stroke-width="0.8"/>
  <text x="68" y="153" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#c7d2fe" text-anchor="middle" font-weight="600">⚡ Intent-to-action semantic alignment</text>
  
  
  
  
  <rect x="122" y="141" width="92" height="18" rx="9" fill="#312e81" stroke="#6366f1" stroke-width="0.8"/>
  <text x="168" y="153" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#c7d2fe" text-anchor="middle" font-weight="600">◈ Composite attack detection</text>
  
  
  
  
  <rect x="22" y="165" width="92" height="18" rx="9" fill="#1e3a5f" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="68" y="177" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#7dd3fc" text-anchor="middle" font-weight="600">🔒 Context-aware credential scoping</text>
  
  
  
  
  <rect x="122" y="165" width="92" height="18" rx="9" fill="#1e3a5f" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="168" y="177" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#7dd3fc" text-anchor="middle" font-weight="600">⬡ Multi-layer enforcement (gateway/SDK/kernel)</text>
  

  <!-- Arrow -->
  <line x1="244" y1="127" x2="280" y2="127" stroke="#4f46e5" stroke-width="1.4" class="flow" marker-end="url(#arr)"/>

  <!-- Output boxes (2) -->
  
  <rect x="284" y="62" width="220" height="58" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <rect x="500" y="62" width="4" height="58" rx="1" fill="#059669"/>
  <text x="296" y="82" font-family="IBM Plex Mono,Courier New,monospace" font-size="9" fill="#065f46" font-weight="700">Policy Decision</text>
  <text x="296" y="97" font-family="IBM Plex Mono,Courier New,monospace" font-size="7.5" fill="#6b7280">ALLOW/DENY/MODIFY/STEP_UP/DEFER</text>
  <text x="296" y="112" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#9ca3af">Context-aware authorization verdict with rationale</text>
  
  <rect x="284" y="130" width="220" height="58" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <rect x="500" y="130" width="4" height="58" rx="1" fill="#059669"/>
  <text x="296" y="150" font-family="IBM Plex Mono,Courier New,monospace" font-size="9" fill="#065f46" font-weight="700">Audit Receipt</text>
  <text x="296" y="165" font-family="IBM Plex Mono,Courier New,monospace" font-size="7.5" fill="#6b7280">SIEM/SOC integration</text>
  <text x="296" y="180" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#9ca3af">Tamper-evident log with hash-chained session state</text>
  

  <!-- Warning strip -->
  <rect x="16" y="202" width="488" height="20" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="260" y="215" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#e11d48" text-anchor="middle" font-weight="700">⚠  No vendor ships GA IBAC platform; solution composition required</text>

  <!-- Framework badges (5) -->
  
  
  
  <rect x="16" y="230" width="88" height="18" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="60" y="242" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#1d4ed8" text-anchor="middle" font-weight="700">OWASP LLM Top 10 (LLM06 Excessive Agency)</text>
  
  
  <rect x="114" y="230" width="88" height="18" rx="3" fill="#faf5ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="158" y="242" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#7e22ce" text-anchor="middle" font-weight="700">MITRE ATLAS (AML.T0053 Tool Invocation)</text>
  
  
  <rect x="212" y="230" width="88" height="18" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="0.8"/>
  <text x="256" y="242" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#9f1239" text-anchor="middle" font-weight="700">NIST AI RMF (GOVERN/MANAGE)</text>
  
  
  <rect x="310" y="230" width="88" height="18" rx="3" fill="#fefce8" stroke="#d97706" stroke-width="0.8"/>
  <text x="354" y="242" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#92400e" text-anchor="middle" font-weight="700">NIST SP 800-207 Zero Trust</text>
  
  
  <rect x="408" y="230" width="88" height="18" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="0.8"/>
  <text x="452" y="242" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#065f46" text-anchor="middle" font-weight="700">EU AI Act (High-Risk Oversight)</text>
  

  <!-- Stats -->
  <line x1="16" y1="258" x2="504" y2="258" stroke="#e0e7ff" stroke-width="0.8"/>
  
  <text x="16" y="284" font-family="IBM Plex Mono,Courier New,monospace" font-size="18" fill="#1e1b4b" font-weight="700">109:1</text>
  <text x="50" y="279" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">Machine:Human</text>
  <text x="50" y="290" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">Identity Ratio</text>
  
  <text x="176" y="284" font-family="IBM Plex Mono,Courier New,monospace" font-size="18" fill="#1e1b4b" font-weight="700">1.99%</text>
  <text x="210" y="279" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">Runtime</text>
  <text x="210" y="290" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">Overhead</text>
  
  <text x="336" y="284" font-family="IBM Plex Mono,Courier New,monospace" font-size="18" fill="#1e1b4b" font-weight="700">0%</text>
  <text x="370" y="279" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">Attack Success</text>
  <text x="370" y="290" font-family="IBM Plex Mono,Courier New,monospace" font-size="7" fill="#6b7280">(SEAgent)</text>
  

  <text x="504" y="302" font-family="IBM Plex Mono,Courier New,monospace" font-size="6.5" fill="#a5b4fc" text-anchor="end">gridthegrey.com</text>
  <polyline points="498,305 512,305 512,294" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <polyline points="10,305 10,311 20,311"   fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
</svg>