name: "Reframe First Look Articles"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to process per batch (0 = all remaining)"
        required: false
        default: "10"
      start_from:
        description: "Skip first N articles (for resuming interrupted runs)"
        required: false
        default: "0"
      dry_run:
        description: "Preview changes without writing files"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  reframe:
    name: "Reframe → Commit"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reframe script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
        run: |
          ARGS="--verbose"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi

          START="${{ github.event.inputs.start_from }}"
          if [ -n "$START" ] && [ "$START" != "0" ]; then
            ARGS="$ARGS --start-from $START"
          fi

          echo "Running: python reframe_first_looks.py $ARGS"
          python reframe_first_looks.py $ARGS

      - name: Commit reframed articles
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Grid the Grey Bot"
          git config user.email "bot@gridthegrey.com"

          git add hugo-site/content/posts/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          REFRAMED=$(git diff --staged --name-only | grep "hugo-site/content/posts/.*\.md" | wc -l | tr -d ' ')
          git commit -m "refactor: reframe ${REFRAMED} first-look article(s) to defender-oriented framing"
          git push
          echo "✓ Committed ${REFRAMED} reframed article(s)."
