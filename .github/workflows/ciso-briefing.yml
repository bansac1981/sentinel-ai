name: "Grid the Grey — CISO Audio Briefing"

# ─────────────────────────────────────────────
# Weekly automated podcast episode:
#   Claude generates script → OpenAI TTS → R2 upload → feed.xml update
# ─────────────────────────────────────────────
on:
  # Every Monday at 10:00 AM IST (04:30 UTC)
  schedule:
    - cron: "30 4 * * 1"

  # Manual trigger for ad-hoc episodes
  workflow_dispatch:
    inputs:
      voice:
        description: "TTS voice"
        required: false
        default: "onyx"
        type: choice
        options:
          - onyx
          - echo
          - nova
          - alloy
          - fable
          - shimmer
      days:
        description: "How many days of articles to include"
        required: false
        default: "7"
      dry_run:
        description: "Dry run — generate script only, skip TTS and R2 upload"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  podcast:
    name: "Generate → Produce → Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── GENERATE SCRIPT ────────────────────────────────────────────────
      - name: Generate briefing script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          echo "Generating briefing script for last ${DAYS} days of articles..."
          python weekly_briefing.py --generate --days "${DAYS}"

      # ── PRODUCE AUDIO + UPLOAD ─────────────────────────────────────────
      - name: Produce audio and upload to R2
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          VOICE="${{ github.event.inputs.voice || 'onyx' }}"
          echo "Producing audio with voice: ${VOICE}"
          python weekly_briefing.py --produce --voice "${VOICE}"

      # ── UPDATE RSS FEED ────────────────────────────────────────────────
      - name: Update podcast RSS feed on R2
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          echo "Regenerating podcast RSS feed..."
          python podcast_feed.py --update

      # ── COMMIT + PUSH ──────────────────────────────────────────────────
      - name: Commit and push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Grid the Grey Bot"
          git config user.email "bot@gridthegrey.com"
          git add briefings/ hugo-site/hugo.toml
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish CISO audio briefing — $(date -u +'%Y-W%V')"
          git push
          echo ""
          echo "══════════════════════════════════════════════"
          echo "  ✓ Episode published"
          echo "  ✓ hugo.toml updated — site rebuild triggered"
          echo "  ✓ RSS feed updated on R2"
          echo "  Spotify will pick up the new episode within ~1 hour"
          echo "══════════════════════════════════════════════"

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run — script generated but no audio produced."
          echo "Re-run with dry_run = false to produce the episode."
