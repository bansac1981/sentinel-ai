name: Publish Deep Signal Article

on:
  push:
    paths:
      - "sources/pending/**.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic jinja2 python-frontmatter

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find pending articles
        id: find
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- 'sources/pending/*.md' 2>/dev/null || \
                  git diff --name-only HEAD -- 'sources/pending/*.md' 2>/dev/null || \
                  find sources/pending -name "*.md" -newer sources/pending 2>/dev/null || \
                  find sources/pending -name "*.md")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish each article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "${{ steps.find.outputs.files }}" | while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "Publishing: $f"
              base=$(basename "$f")
              if [[ "$base" == gap-* ]]; then
                article_type="1"
              elif [[ "$base" == cap-* ]]; then
                article_type="2"
              else
                echo "ERROR: filename must start with 'gap-' or 'cap-' to set article type"
                echo "  Rename the file and push again."
                exit 1
              fi
              python scripts/publish_deep_signal.py "$f" "$article_type"
            fi
          done
