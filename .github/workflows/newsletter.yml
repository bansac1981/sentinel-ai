name: "Grid the Grey — Newsletter Dispatch"

# ─────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────
on:
  # Daily at 2:00 PM IST (08:30 UTC), Monday–Sunday
  schedule:
    - cron: "30 8 * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      days:
        description: "Look back N days for posts (default: 2)"
        required: false
        default: "2"
      dry_run:
        description: "Dry run — build digest but skip API send"
        type: boolean
        required: false
        default: false
      subject:
        description: "Custom subject line (leave blank for auto-generated)"
        required: false
        default: ""

# ─────────────────────────────────────────────
# Permissions — read-only, no repo writes needed
# ─────────────────────────────────────────────
permissions:
  contents: read

# ─────────────────────────────────────────────
# Job
# ─────────────────────────────────────────────
jobs:
  send-newsletter:
    name: "Build → Send"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout (needs post content)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Python setup
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Save digest HTML as artifact (always, even on dry run)
      - name: Generate digest HTML
        env:
          INPUT_DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          python newsletter_digest.py --days "$INPUT_DAYS" --output digest.html
          echo "Digest saved to digest.html"
          wc -c digest.html

      # 5. Upload digest as artifact for inspection
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-digest-${{ github.run_number }}
          path: digest.html
          retention-days: 14

      # 6. Send via Resend API (subscribers pulled from Mailerlite)
      - name: Send newsletter
        env:
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          MAILERLITE_API_KEY:   ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_LIST_ID:   ${{ secrets.MAILERLITE_LIST_ID }}
          UNSUBSCRIBE_SECRET:   ${{ secrets.UNSUBSCRIBE_SECRET }}
          INPUT_DAYS:         ${{ github.event.inputs.days || '2' }}
          INPUT_DRY_RUN:      ${{ github.event.inputs.dry_run }}
          INPUT_SUBJECT:      ${{ github.event.inputs.subject }}
        run: |
          EXTRA_ARGS=()
          [ "$INPUT_DRY_RUN" = "true" ] && EXTRA_ARGS+=(--dry-run)
          [ -n "$INPUT_SUBJECT" ] && EXTRA_ARGS+=(--subject "$INPUT_SUBJECT")

          echo "Running: python newsletter_digest.py --send --days $INPUT_DAYS ${EXTRA_ARGS[*]}"
          python newsletter_digest.py --send --days "$INPUT_DAYS" "${EXTRA_ARGS[@]}"
