name: "Grid the Grey — Unpublish Article"

# ─────────────────────────────────────────────
# Remove a mistakenly published article
# Works for regular posts and deep-signal articles
# ─────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article URL, slug, title, or partial filename (e.g. 'https://gridthegrey.com/deep-signal/weekly-signal-report-2026w31/' or 'Claude Code Security Playbook')"
        required: true
        type: string
      mode:
        description: "What to do with the article"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - delete

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unpublish:
    name: "Unpublish Article"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpublish article
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python unpublish.py "$INPUT_SLUG" --mode "$INPUT_MODE"

      - name: Commit and push
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          git config user.name  "Grid the Grey Bot"
          git config user.email "bot@gridthegrey.com"
          git add hugo-site/content/ hugo-site/static/img/signal/
          if git diff --staged --quiet; then
            echo "No changes — article may not exist or was already in desired state."
            exit 0
          fi
          if [ "$INPUT_MODE" = "draft" ]; then
            git commit -m "fix: unpublish article — set to draft ($INPUT_SLUG)"
          else
            git commit -m "fix: unpublish article — deleted ($INPUT_SLUG)"
          fi
          git pull --rebase
          git push

          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "  ✓ Article '$SLUG' has been ${MODE}ed"
          echo "  ✓ deploy.yml will rebuild the site without this article"
          echo "══════════════════════════════════════════════════════════════"
